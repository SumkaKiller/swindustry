# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Parchment mappings — must match the versions used by SW: Worldgen Core so both mods
# decompile against identical parameter names.
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Environment Properties
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.234
neo_version_range=[21.1.0,)
loader_version_range=[1,)

## Mod Properties

mod_id=swindustry
mod_name=SW: Industry
mod_license=All Rights Reserved
mod_version=1.0.0
mod_group_id=com.jokerdayn.swindustry
mod_authors=jokerdayn
mod_description=Multiblock industry for the Sea Worthy modpack. Primitive fire, the clay kiln, and the bronze age.

## Sibling mod this one builds on

# SW: Worldgen Core supplies the ocean dimension, the island boulders and the bronze ore
# that this mod's progression is built around.
worldgen_core_mod_id=swworldgencore
worldgen_core_version_range=[1.0.0,)
